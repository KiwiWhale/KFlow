name: Bug report
description: Report a reproducible bug in KiwiFlow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether the issue has already been reported.
        Include a minimal reproduction whenever possible.
        If your issue involves Ktor or Spring integration, please specify the framework version.

  - type: input
    id: version
    attributes:
      label: KiwiFlow version
      description: The released version or commit hash (e.g., 1.0.0-SNAPSHOT).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: kotlin
    attributes:
      label: Kotlin version
      description: The version of Kotlin you are using.
      placeholder: "2.1.0"
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Framework (Ktor / Spring Boot)
      description: If applicable, list the framework and its version. Leave blank if using Core only.
      placeholder: "Spring Boot 3.3.0 / Ktor 3.0.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest complete example.
      placeholder: |
        1. Define a @Workflow annotated class...
        2. Execute it via SpringWorkflowFactory...
        3. Exception thrown during step execution...
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages and logs
      description: Include relevant stack traces. Redact sensitive information.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that this issue has not already been reported.
          required: true
        - label: I can reproduce this issue with the information provided.
          required: true